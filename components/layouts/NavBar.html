<style>
  .box_menu {
    background-color: var(--bg-menu);
    border-radius: var(--box-radius);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 12px 0;
    margin: 30px 0;

    box-shadow: var(--box-shadow);
  }

  .box_menu a my-icon {
    width: 2.5rem;
    height: 2.5rem;
  }

  .box_menu a {
    --tooltip-offset: -30px;
    padding: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  @media (hover: hover) and (pointer: fine) {
    .box_menu a:hover {
      color: var(--hover);
    }
  }

  .box_menu a.active {
    color: var(--hover);
  }

  @media (max-width: 800px) {
    .box_menu {
      margin: 30px 5%;
    }
  }

  @media (max-width: 500px) {
    .box_menu {
      margin: 30px 1%;
    }
  }
</style>

<ul class="box_menu effect-ripple">
  <li>
    <a href="#/home" page data-tooltip="Inicio"
      ><my-icon data-icon="home"></my-icon
    ></a>
  </li>
  <li>
    <a href="#/about" page data-tooltip="Sobre"
      ><my-icon data-icon="about"></my-icon
    ></a>
  </li>
  <li>
    <a href="#/work" page data-tooltip="Trabalho"
      ><my-icon data-icon="work"></my-icon
    ></a>
  </li>
  <li>
    <button class="button-theme" aria-label="Alternar tema">
      <span class="toggle_track" data-tooltip="Trocar Tema">
        <span class="toggle_thumb">
          <my-icon data-icon="sun"></my-icon>
          <my-icon data-icon="moon"></my-icon>
        </span>
      </span>
    </button>
  </li>
  <li>
    <a href="#/hobby" page data-tooltip="Hobbies"
      ><my-icon data-icon="hobby"></my-icon
    ></a>
  </li>
  <li>
    <a href="#/gallery" page data-tooltip="Galeria"
      ><my-icon data-icon="gallery"></my-icon
    ></a>
  </li>
  <li>
    <a href="#footer" move data-tooltip="Rodapé"
      ><my-icon data-icon="footer"></my-icon
    ></a>
  </li>
</ul>

<script>
  function updateActiveMenu() {
    const links = document.querySelectorAll(
      '.box_menu a:not([href="#footer"])'
    )

    const currentHash = window.location.hash

    // Não altera o active quando estiver no footer
    if (currentHash === '#footer') {
      return
    }

    links.forEach((link) => {
      if (link.getAttribute('href') === currentHash) {
        link.classList.add('active')
      } else {
        link.classList.remove('active')
      }
    })
  }

  window.addEventListener('hashchange', updateActiveMenu)

  document.addEventListener(
    'spa:pageLoaded',
    updateActiveMenu
  )

  window.addEventListener('load', () => {
    if (!window.location.hash) {
      window.location.hash = '#/home'
    }

    updateActiveMenu()
  })
</script>
